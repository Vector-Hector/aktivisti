apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: wkapp-ingress
spec:
  tls:
    - hosts:
        - development.wk-frontend.haze.alt.coop
      secretName: tls-secrets
  rules:
    - host: development.wk-frontend.haze.alt.coop
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: wkapp
                port:
                  number: 5000
