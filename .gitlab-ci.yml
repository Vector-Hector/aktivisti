stages:
  - audit
  - test
  - build

workflow:
  auto_cancel:
    on_new_commit: interruptible

default:
  interruptible: true

.development_env: &development_env
  environment:
    action: prepare
    name: development
  rules:
    - if: $CI_COMMIT_BRANCH && $CI_COMMIT_BRANCH != "main" && $CI_COMMIT_BRANCH !~ /^release\/(\d+\.)(\d+\.)(\d+)$/
      when: on_success
    - when: never

.staging_env: &staging_env
  environment:
    action: prepare
    name: staging
  rules:
    - if: $CI_COMMIT_TAG || $CI_COMMIT_BRANCH == "main" || $CI_COMMIT_BRANCH =~ /^release\/(\d+\.)(\d+\.)(\d+)$/
      when: on_success
    - when: never

npm_audit:
  image: node:20
  stage: audit
  script:
    - apt update
    - apt install s-nail
    - npm ci
    - ./scripts/setup_mail.sh
    - npm audit || ./scripts/send_mail.sh
  rules:
    - if: $NPM_AUDIT == "true"
      when: on_success
    - when: never

lint:
  image: node:20-alpine
  stage: test
  before_script:
    - apk update && apk add git
  script:
    - npm --version
    - npm ci
    - npm run lint
  cache:
    paths:
      - node_modules/
  rules:
    - if: $NPM_AUDIT != "true" && $CI_COMMIT_BRANCH
      when: on_success
    - when: never

.pwa:
  image: node:20-alpine
  stage: build
  before_script:
    - apk update && apk add git
  script:
    - npm --version
    - npm ci
    - mkdir -p public/.well-known
    - cp $ANDROID_ASSOCIATION_FILE public/.well-known/assetlinks.json
    - npm run build -- -m pwa
  cache:
    paths:
      - node_modules/
  artifacts:
    name: 'artifacts_pwa_$CI_COMMIT_REF_NAME'
    paths:
      - dist/

.android:
  image: cimg/android:2024.07-node
  stage: build
  before_script:
    - sudo npm install -g npm@^10
    - echo $APP_ANDROID_KEYSTORE_B64 | base64 -d > my.keystore
    - echo "keystorePath=my.keystore" > android-signing.properties
    - echo "keystorePassword=$APP_ANDROID_KEYSTORE_PASSWORD" >> android-signing.properties
    - echo "keyAlias=$APP_ANDROID_KEYSTORE_ALIAS" >> android-signing.properties
    - echo "keyPassword=$APP_ANDROID_KEYSTORE_PASSWORD" >> android-signing.properties
    - cp "$GOOGLE_SERVICES_FILE" src-capacitor/android/app/google-services.json
  script:
    - npx quasar build -m capacitor -T android
  cache:
    paths:
      - node_modules/
  artifacts:
    name: 'artifacts_android_$CI_COMMIT_REF_NAME'
    paths:
      - src-capacitor/android/app/build/

android-development:
  extends: .android
  <<: *development_env
  rules:
    - if: $CI_COMMIT_BRANCH && $NPM_AUDIT != "true"
      when: on_success
    - when: never

android-staging:
  extends: .android
  <<: *staging_env
  rules:
    - if: $CI_COMMIT_BRANCH && $NPM_AUDIT != "true"
      when: on_success
    - when: never

pwa-development:
  extends: .pwa
  <<: *development_env
  rules:
    - if: $CI_COMMIT_BRANCH && $NPM_AUDIT != "true"
      when: on_success
    - when: never

pwa-staging:
  extends: .pwa
  <<: *staging_env
  rules:
    - if: $CI_COMMIT_BRANCH && $NPM_AUDIT != "true"
      when: on_success
    - when: never
